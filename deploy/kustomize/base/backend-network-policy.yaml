apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-substrate-dashboard-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-substrate-dashboard
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: agent-substrate-dashboard
          app.kubernetes.io/component: frontend
    ports:
    - port: 8080
      protocol: TCP
